[package]
name = "pixel-regrid"
version = "1.0.0"
description = "Restore AI-generated pixel art grids, resize images and adjust canvases"
edition = "2021"
license = "MIT"
repository = "https://github.com/mmm-2006/Pixel-Regrid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
custom-protocol = ["tauri/custom-protocol"]
